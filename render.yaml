services:
  - type: web
    name: escape-io
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODELS
        value: gemini-flash-lite-latest,gemini-3.5-flash-lite
      - key: GEMINI_THINKING_OFF
        value: "0"
      - key: NODE_VERSION
        value: "24"
